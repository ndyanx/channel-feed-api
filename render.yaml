services:
  - type: web
    name: channel-feed-api
    runtime: node
    plan: free            # cambia a starter si no quieres que se duerma por inactividad
    region: oregon        # elige la mas cercana a tus usuarios
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm build
    startCommand: pnpm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: HOST
        value: 0.0.0.0
      # Render va detras de un proxy: sin esto el limite por IP vería una sola IP para todos.
      - key: TRUST_PROXY
        value: "true"
      # Origen(es) del frontend, separados por comas. Render te lo pedira al crear el Blueprint.
      # Ej: https://mosaico.pages.dev,https://*.mosaico.pages.dev  (el segundo cubre los previews)
      - key: CORS_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: info
